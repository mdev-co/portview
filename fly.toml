# Fly.io app configuration for the SPS api.
#
# Build context is the repo root; the Dockerfile path is relative to
# that. `fly launch` (run from the repo root) writes this file and
# subsequent `fly deploy` reads it.
#
# Region fra (Frankfurt) is the closest Fly.io point of presence to
# Szczecin still accepting new resources (waw was deprecated and
# rejects new machines as of 2026-05). Round trip latency from
# Niebuszewo on residential fibre is ~35-50 ms.

app = "sps-api"
primary_region = "fra"

[build]
  dockerfile = "apps/api/Dockerfile"

# Prisma migrations run ONCE per deploy in a temporary release VM
# (Fly spins it from the freshly built image, waits for exit, only
# promotes the image to the running machine on success). Keeping
# migrate out of the runtime boot path is the single biggest win:
# every machine restart skips the ~30 s prisma engine warmup + DB
# round trip, taking cold-boot from ~70 s down to ~30 s. Failed
# migrations abort the deploy without touching production - the
# previously running machine keeps serving traffic.
[deploy]
  release_command = "npx prisma migrate deploy --schema=prisma/schema.prisma"

[env]
  # Application-level config that is not a secret.
  NODE_ENV = "production"
  PORT = "3000"
  # EXTERNAL_FEED_ENDPOINT and EXTERNAL_FEED_TOKEN are intentionally
  # NOT in [env]. Both reveal the upstream vendor and are injected at
  # deploy time via `fly secrets set` to keep the tracked config free
  # of vendor identifiers. See .env.example.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Boot budget: tailscale handshake + cert materialisation + nest
  # startup lands around ~30 s after migrate moved to release_command
  # (was 60-70 s when migrate ran per boot). 60 s is 2x headroom on
  # that floor and also the hard cap Fly enforces on HTTP service
  # checks ("Service HTTP check has a grace period greater than 1
  # minute; this will be lowered to 1 minute"); setting higher in
  # config is silently clamped. If boot ever creeps back above 30 s
  # we lower it at the source rather than fight the platform.
  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Persistent Tailscale daemon state. The state file holds the device's
# private key and machine identity. Without persistence the container's
# /tmp resets on every deploy and the daemon registers as a NEW device
# (so the hostname `sps-api-fly` gets a `-1`, `-2`, ... suffix and the
# tailnet IP rotates). With the volume mounted at /var/lib/tailscale,
# the same identity survives deploys and the hostname + IP stay stable.
#
# Volume size 1 GB is dramatically larger than the state file (~few KB)
# but is the minimum Fly volume size and costs effectively nothing.
[mounts]
  source = "tailscale_state"
  destination = "/var/lib/tailscale"

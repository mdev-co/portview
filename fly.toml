# Fly.io app configuration for the SPS api.
#
# Build context is the repo root; the Dockerfile path is relative to
# that. `fly launch` (run from the repo root) writes this file and
# subsequent `fly deploy` reads it.
#
# Region fra (Frankfurt) is the closest Fly.io point of presence to
# Szczecin still accepting new resources (waw was deprecated and
# rejects new machines as of 2026-05). Round trip latency from
# Niebuszewo on residential fibre is ~35-50 ms.

app = "sps-api"
primary_region = "fra"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  # Application-level config that is not a secret.
  NODE_ENV = "production"
  PORT = "3000"
  # EXTERNAL_FEED_ENDPOINT and EXTERNAL_FEED_TOKEN are intentionally
  # NOT in [env]. Both reveal the upstream vendor and are injected at
  # deploy time via `fly secrets set` to keep the tracked config free
  # of vendor identifiers. See .env.example.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

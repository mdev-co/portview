name: Bug
description: Something is broken or misbehaving
title: 'fix(scope): '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Replace `scope` in the title with the affected area (e.g. `fix(api):`, `fix(web):`, `fix(ingest):`).
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, ordered steps that reliably reproduce the bug.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happens.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, browser if relevant, commit SHA, source (local SDR / fallback feed).
      value: |
        - Node:
        - OS:
        - Browser:
        - Commit:
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Paste relevant logs or stack traces. Will be rendered as a code block.
      render: shell
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web
        - api
        - ingest
        - shared
        - infra
        - docs
        - cross-cutting
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - critical - data loss or app unusable
        - high - core feature broken, no workaround
        - medium - feature broken, workaround exists
        - low - cosmetic or minor inconvenience
    validations:
      required: true

name: deploy-api

# Auto-deploy the api to Fly.io on every push to main that actually
# changes the api or its build inputs. Runs on the Fly remote builder
# (--remote-only) so the GitHub Actions runner only orchestrates the
# call and ships logs back; the actual Docker build happens on Fly
# infrastructure where the secrets and registry live.
#
# Setup: a Fly API token must be present as a GitHub repository
# secret named FLY_API_TOKEN. Generate via `fly auth token` locally,
# then Settings -> Secrets and variables -> Actions -> New repository
# secret. The token must have deploy permissions on the sps-api app.

on:
  push:
    branches:
      - main
    # Only redeploy when something the api build depends on changes.
    # A pure web / docs / adr change has zero effect on the api image
    # and would burn build minutes for no gain.
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'fly.toml'
      - '.github/workflows/deploy-api.yml'

# Cancel an in-flight deploy if a newer commit lands on main. Fly
# itself serialises rollouts but cancelling the older job in CI saves
# minutes and avoids confusing "stale deploy succeeded just now"
# notifications.
concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: flyctl deploy sps-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        # fly.toml lives at the repo root so the dockerfile path
        # ("apps/api/Dockerfile") resolves against the same directory
        # the Dockerfile expects as its build context. flyctl picks
        # the toml up automatically from the working directory; no
        # --config flag needed.
        run: flyctl deploy --remote-only --app sps-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deploy health
        # Post-deploy gate. flyctl deploy returns when the rolling
        # strategy reports a "healthy" machine, but Fly's own health
        # probe runs against the internal port; an externally
        # observable 200 from the public load balancer can still lag
        # by several seconds (warm-up, CF cache settle, edge routing).
        # We hit the public fly.dev origin directly so Cloudflare is
        # bypassed - if this step fails the operator sees a red X in
        # the Actions tab instead of finding out via "vessels gone".
        # Retries cover the worst-case 90 s grace_period boot window
        # plus settle: 6 attempts x 30 s = 3 min budget.
        run: |
          set -e
          echo "Waiting 60 s for the rolling deploy to settle..."
          sleep 60
          curl --fail --max-time 10 --retry 5 --retry-delay 30 \
               --retry-all-errors --silent --show-error \
               -o /dev/null -w 'health probe: HTTP %{http_code} time=%{time_total}s\n' \
               https://sps-api.fly.dev/

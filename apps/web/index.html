<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Port Szczecin</title>
    <meta
      name="description"
      content="Real-time AIS vessel tracking for the Port of Szczecin. Custom SDR receiver, React + MapLibre frontend, NestJS + PostGIS backend."
    />
    <meta name="theme-color" content="#0f172a" />

    <!--
      Tile-origin connection hints. The Presentation basemap (default)
      and every other map style fetch raster tiles from these CDNs as
      soon as the map mounts. `preconnect` opens TCP + TLS before the
      JS parses; `dns-prefetch` resolves DNS for origins only needed
      on a style switch. `crossorigin` is required for preconnect to
      reuse the connection on a CORS-fetched origin.
    -->
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin />
    <link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin />
    <link rel="preconnect" href="https://c.basemaps.cartocdn.com" crossorigin />
    <link rel="preconnect" href="https://d.basemaps.cartocdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />
    <link rel="dns-prefetch" href="https://api.maptiler.com" />
    <link rel="dns-prefetch" href="https://server.arcgisonline.com" />
    <link rel="dns-prefetch" href="https://tiles.openseamap.org" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Smart Port Szczecin" />
    <meta property="og:title" content="Smart Port Szczecin - Real-time AIS vessel tracking" />
    <meta
      property="og:description"
      content="Live AIS tracking for the Port of Szczecin from a custom SDR receiver. React + MapLibre frontend, NestJS + PostGIS backend."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://sps-radar.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Smart Port Szczecin" />
    <meta
      name="twitter:description"
      content="Real-time AIS vessel tracking for the Port of Szczecin."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

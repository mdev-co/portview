language: en-US
early_access: false
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - '!**/dist/**'
    - '!**/node_modules/**'
    - '!**/generated/**'
    - '!**/*.lock'
    - '!**/*.lockb'
    - '!pnpm-lock.yaml'
  tools:
    ast-grep:
      essential_rules: true
    languagetool:
      enabled: false
    biome:
      enabled: false
    ruff:
      enabled: false
chat:
  auto_reply: true
knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
